<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SBSU AI Studio - FINAL FIXED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f172a;--panel:rgba(15,23,42,.85);--glass:rgba(30,41,59,.6);--border:rgba(148,163,184,.15);--text:#e6edf7;--muted:#8fa3bd}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
.panel{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--border)}
.glass{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border)}
.grad-text{background:linear-gradient(92deg,#38bdf8,#818cf8,#e879f9);-webkit-background-clip:text;color:transparent}
.grad-btn{background:linear-gradient(92deg,#0ea5e9,#6366f1)}
.drawer{transition:transform.3s ease}
.tab-on{background:var(--glass);color:#38bdf8!important}
</style>
</head>
<body>
<div class="relative z-10 flex flex-col h-screen">
<header class="panel h-14 flex items-center gap-2 px-3 border-x-0 border-t-0">
<div class="w-9 h-9 rounded-xl grad-btn flex items-center justify-center font-bold text-white">SB</div>
<div><div class="font-bold text-sm">SBSU <span class="grad-text">AI Studio</span></div><div class="text-[10px] text-[var(--muted)]">Ferozepur - Sofia AI - FINAL</div></div>
<div class="flex-1"></div>
<button id="btnConnect" class="panel px-3 py-1.5 rounded-xl text-xs">Connect</button>
<button id="btnAgents" class="panel px-3 py-1.5 rounded-xl text-xs">Agents</button>
<button id="btnZip" class="panel px-3 py-1.5 rounded-xl text-xs">ZIP</button>
<button id="btnSettings" class="panel px-2 py-1.5 rounded-xl text-xs">⚙️</button>
<button id="btnMenu" class="lg:hidden panel p-2 rounded-xl">☰</button>
</header>
<main class="flex-1 min-h-0 lg:grid lg:grid-cols-[300px_1fr_420px] relative">
<div id="backdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>
<aside id="sidebar" class="drawer fixed lg:static z-40 inset-y-0 left-0 w-72 lg:w-auto -translate-x-full lg:translate-x-0 panel border-y-0 border-l-0 flex flex-col">
<div class="p-3"><button id="btnNewChat" class="grad-btn w-full py-2.5 rounded-2xl text-white text-sm font-bold">+ New Chat</button></div>
<div class="flex-1 overflow-y-auto px-2 text-xs" id="leftProjects"></div>
</aside>
<section class="flex flex-col min-h-0">
<div id="hero" class="flex-1 flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
<div class="w-20 h-20 rounded-3xl grad-btn flex items-center justify-center text-white font-extrabold text-3xl mb-4">S</div>
<h1 class="text-3xl font-extrabold">Hi, I'm <span class="grad-text">Sofia</span> — What shall we build?</h1>
<p class="text-[var(--muted)] text-sm max-w-xl mt-3">SBSU Ferozepur AI Studio - Build Apps, Websites, Games - Voice PA/HI/EN - 32 Keys - QR WebRTC</p>
<div class="glass rounded-3xl w-full max-w-2xl mt-6 p-2 flex items-center gap-2">
<input id="buildInput" class="flex-1 bg-transparent outline-none px-3 py-3 text-sm" placeholder="Build me a... expense tracker, snake, minecraft, pubg"/>
<select id="voiceLang" class="glass rounded-xl px-2 py-2 text-xs"><option value="en-IN">EN</option><option value="hi-IN">HI</option><option value="pa-IN">PA</option></select>
<button id="micBuild" class="panel p-2.5 rounded-xl">🎤</button>
<button id="buildGo" class="grad-btn text-white px-5 py-2.5 rounded-2xl text-sm font-bold">Build</button>
</div>
<div class="flex flex-wrap justify-center gap-2 mt-4">
<button class="sugg panel px-3 py-1 rounded-full text-xs">Expense Tracker PWA</button>
<button class="sugg panel px-3 py-1 rounded-full text-xs">Snake Game</button>
<button class="sugg panel px-3 py-1 rounded-full text-xs">Minecraft Three.js</button>
<button class="sugg panel px-3 py-1 rounded-full text-xs">PUBG Babylon.js</button>
</div>
</div>
<div id="chatPanel" class="hidden flex-col flex-1 min-h-0">
<div id="msgs" class="flex-1 overflow-y-auto p-3 space-y-4"></div>
<div class="p-3 border-t" style="border-color:var(--border)">
<div class="glass rounded-2xl flex items-end gap-1 p-2">
<button id="btnAttach" class="panel p-2.5 rounded-xl">📎</button>
<input type="file" id="fileInput" accept="image/*,.pdf" hidden/>
<textarea id="chatInput" rows="1" class="flex-1 bg-transparent outline-none resize-none py-2.5 text-sm" placeholder="Message Sofia..."></textarea>
<button id="micChat" class="panel p-2.5 rounded-xl">🎤</button>
<button id="btnSend" class="grad-btn p-2.5 rounded-xl text-white">➤</button>
</div>
</div>
</div>
</section>
<aside id="rightbar" class="drawer fixed lg:static z-40 inset-y-0 right-0 w-full sm:w-[420px] lg:w-auto translate-x-full lg:translate-x-0 panel border-y-0 border-r-0 flex flex-col">
<div class="p-2 flex gap-1 border-b text-xs font-bold" style="border-color:var(--border)">
<button id="tabPreview" class="tab-on px-3 py-1.5 rounded-lg">Preview</button>
<button id="tabCode" class="px-3 py-1.5 rounded-lg">Code</button>
<button id="btnCloseR" class="lg:hidden ml-auto panel p-1 rounded-lg">✕</button>
</div>
<div id="panePreview" class="flex-1 relative">
<iframe id="previewFrame" class="w-full h-full border-0 bg-white hidden" sandbox="allow-scripts"></iframe>
<div id="previewEmpty" class="absolute inset-0 flex items-center justify-center text-center p-6 text-sm text-[var(--muted)]">Live preview here</div>
</div>
<div id="paneCode" class="hidden flex-1 flex-col">
<pre id="codeView" class="flex-1 overflow-auto p-3 text-[10px]">// code</pre>
<div class="p-2 flex gap-2"><button id="btnCopyCode" class="panel flex-1 py-2 rounded-xl text-xs">Copy</button><button id="btnDlHtml" class="grad-btn flex-1 py-2 rounded-xl text-white text-xs">Download HTML</button></div>
</div>
</aside>
</main>
</div>
<div id="modalSettings" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-3">
<div class="panel rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-5">
<div class="flex justify-between mb-3"><h2 class="font-bold">Settings - 32 API Keys</h2><button id="closeSettings" class="panel p-2 rounded-xl">✕</button></div>
<div id="apiKeysGrid" class="grid sm:grid-cols-2 gap-2 text-xs"></div>
<button id="saveSettings" class="grad-btn w-full mt-3 py-3 rounded-xl text-white font-bold">Save All Keys</button>
</div>
</div>
<div id="modalConnect" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-3">
<div class="panel rounded-3xl w-full max-w-md p-5 text-center">
<div class="flex justify-between"><h2 class="font-bold">Connect QR WebRTC Master/Slave</h2><button id="closeConnect" class="panel p-2 rounded-xl">✕</button></div>
<div id="qrBox" class="flex justify-center p-3 glass rounded-2xl my-3"></div>
<div id="peerId" class="text-[10px]"></div>
<div id="connectedPeers" class="text-xs mt-2 text-left"></div>
<input id="broadcastCmd" class="glass w-full mt-3 px-3 py-2 rounded-xl text-xs" placeholder="Broadcast: open youtube"/>
<button id="btnBroadcast" class="grad-btn w-full mt-2 py-2 rounded-xl text-white text-xs">Broadcast to All Devices</button>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
let currentHtml='',projects=JSON.parse(localStorage.getItem('sbsu_projects')||'[]'),ttsOn=true,peer=null,connections=[];
const API_KEYS=["GEMINI_API_KEY","GROQ_API_KEY","OPENROUTER_API_KEY","HUGGINGFACE_API_KEY","DEEPSEEK_API_KEY","TOGETHER_API_KEY","MISTRAL_API_KEY","COHERE_API_KEY","OPENAI_API_KEY","ANTHROPIC_API_KEY","REPLICATE_API_KEY","STABILITY_API_KEY","ELEVENLABS_API_KEY","REMOVE_BG_API_KEY","PEXELS_API_KEY","UNSPLASH_API_KEY","PIXABAY_API_KEY","GOOGLE_MAPS_API_KEY","GOOGLE_SEARCH_API_KEY","YOUTUBE_API_KEY","GOOGLE_DRIVE_API_KEY","GOOGLE_SHEETS_API_KEY","GMAIL_API_KEY","FIREBASE_API_KEY","SUPABASE_URL","SUPABASE_ANON_KEY","WEATHER_API_KEY","NEWS_API_KEY","TELEGRAM_BOT_TOKEN","GITHUB_TOKEN","CLOUDINARY_API_KEY","STRIPE_API_KEY"];
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function toggleSidebar(show){const sb=$('#sidebar'),bd=$('#backdrop'); if(show){sb.classList.remove('-translate-x-full'); bd.classList.remove('hidden')} else {sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); $('#rightbar').classList.add('translate-x-full')} }
function toggleRight(show){const rb=$('#rightbar'),bd=$('#backdrop'); if(show){rb.classList.remove('translate-x-full'); if(innerWidth<1024) bd.classList.remove('hidden')} else {rb.classList.add('translate-x-full'); if($('#sidebar').classList.contains('-translate-x-full')) bd.classList.add('hidden')} }
$('#btnMenu').onclick=()=>toggleSidebar(true);
$('#backdrop').onclick=()=>{toggleSidebar(false); toggleRight(false)};
$('#btnCloseR').onclick=()=>toggleRight(false);
function renderProjects(){$('#leftProjects').innerHTML=projects.map(p=>`<div class="panel p-2 rounded-xl cursor-pointer" onclick="loadProject(${p.id})"><div class="font-bold truncate">${escapeHtml(p.title)}</div><div class="text-[10px] text-[var(--muted)]">${p.time}</div></div>`).join('')||'<div class="p-2 text-[var(--muted)]">No projects - Build one!</div>';}
renderProjects();
window.loadProject=(id)=>{const p=projects.find(x=>x.id===id); if(!p) return; currentHtml=p.html; $('#previewFrame').srcdoc=p.html; $('#previewFrame').classList.remove('hidden'); $('#previewEmpty').classList.add('hidden'); $('#codeView').textContent=p.html; showChat(); addMsg('sofia',`Loaded <b>${escapeHtml(p.title)}</b>`); toggleRight(true);};
function showChat(){$('#hero').classList.add('hidden');$('#chatPanel').classList.remove('hidden');$('#chatPanel').classList.add('flex');toggleSidebar(false);}
function addMsg(role,html){const wrap=document.createElement('div');wrap.className='flex gap-2 '+(role==='user'?'justify-end':'');if(role==='user'){wrap.innerHTML=`<div class="grad-btn text-white px-4 py-2.5 rounded-2xl text-sm max-w-[85%]">${escapeHtml(html)}</div>`}else{wrap.innerHTML=`<div class="flex gap-2 max-w-[92%]"><div class="w-8 h-8 rounded-xl grad-btn flex items-center justify-center text-white font-bold text-xs">S</div><div class="glass rounded-2xl px-4 py-3 text-sm">${html}</div></div>`}$('#msgs').appendChild(wrap);$('#msgs').scrollTop=$('#msgs').scrollHeight;if(role==='sofia'&&ttsOn&&'speechSynthesis' in window){const t=document.createElement('div');t.innerHTML=html;const u=new SpeechSynthesisUtterance(t.textContent.slice(0,400));u.lang=$('#voiceLang').value||'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u);}}
function generateApp(prompt){const p=prompt.toLowerCase();let h='';
if(p.includes('expense')){h=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-slate-50 p-4"><div class="max-w-2xl mx-auto"><h1 class="text-3xl font-extrabold">💰 Expense Tracker - SBSU</h1><div class="grid grid-cols-2 gap-3 mt-4"><div class="bg-white p-4 rounded-2xl shadow"><div class="text-xs text-slate-500">Total</div><div id="total" class="text-2xl font-bold">₹0</div></div><div class="bg-white p-4 rounded-2xl shadow"><div class="text-xs text-slate-500">Count</div><div id="count" class="text-2xl font-bold">0</div></div></div><div class="bg-white p-4 rounded-2xl shadow mt-4 flex gap-2"><input id="desc" placeholder="Desc" class="flex-1 border rounded-xl px-3 py-2"/><input id="amt" type="number" placeholder="₹" class="w-24 border rounded-xl px-3 py-2"/><button onclick="addExp()" class="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold">Add</button></div><div id="list" class="mt-4 space-y-2"></div></div><script>let exps=JSON.parse(localStorage.getItem('exps')||'[]');function save(){localStorage.setItem('exps',JSON.stringify(exps))}function render(){let t=0;const list=document.getElementById('list');list.innerHTML=exps.map((e,i)=>{t+=e.a;return '<div class="bg-white p-3 rounded-xl flex justify-between"><span>'+e.d+' <small class="text-slate-400">'+e.date+'</small></span><b>₹'+e.a+' <button onclick="del('+i+')" class="text-red-500 ml-2">✕</button></b></div>'}).join('');document.getElementById('total').textContent='₹'+t;document.getElementById('count').textContent=exps.length;save()}function addExp(){const d=document.getElementById('desc').value;const a=parseFloat(document.getElementById('amt').value);if(!d||!a)return;exps.unshift({d,a,date:new Date().toLocaleDateString()});document.getElementById('desc').value='';document.getElementById('amt').value='';render()}function del(i){exps.splice(i,1);render()}render();<\/script></body></html>`;}
else if(p.includes('minecraft')||p.includes('snake')){h=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>body{margin:0;background:#0f172a;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}canvas{border:2px solid #38bdf8;border-radius:16px}<\/style></head><body><h1>🎮 Game</h1><canvas id="c" width="320" height="320"></canvas><p id="score">Score:0</p><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let snake=[{x:10,y:10}],food={x:15,y:10},dir={x:1,y:0},score=0;function loop(){const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0)h.x=19;if(h.x>19)h.x=0;if(h.y<0)h.y=19;if(h.y>19)h.y=0;if(snake.some(s=>s.x==h.x&&s.y==h.y)){snake=[{x:10,y:10}];score=0}snake.unshift(h);if(h.x==food.x&&h.y==food.y){food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};score+=10}else snake.pop();ctx.fillStyle='#0f172a';ctx.fillRect(0,0,320,320);ctx.fillStyle='#e879f9';ctx.fillRect(food.x*16,food.y*16,14,14);ctx.fillStyle='#38bdf8';snake.forEach(s=>ctx.fillRect(s.x*16,s.y*16,14,14));document.getElementById('score').textContent='Score:'+score}setInterval(loop,120);<\/script></body></html>`;}
else if(p.includes('pubg')||p.includes('gta')){h=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://cdn.babylonjs.com/babylon.js"><\/script><style>body{margin:0;overflow:hidden}canvas{width:100%;height:100vh}<\/style></head><body><canvas id="c"></canvas><script>const canvas=document.getElementById('c');const engine=new BABYLON.Engine(canvas,true);const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color3(0.05,0.1,0.15);const cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,Math.PI/2.5,20,BABYLON.Vector3.Zero(),scene);cam.attachControl(canvas,true);const light=new BABYLON.HemisphericLight('l',new BABYLON.Vector3(0,1,0),scene);const g=BABYLON.MeshBuilder.CreateGround('g',{width:50,height:50},scene);const m=new BABYLON.StandardMaterial('m',scene);m.diffuseColor=new BABYLON.Color3(0.2,0.6,1);g.material=m;const box=BABYLON.MeshBuilder.CreateBox('b',{size:2},scene);box.position.y=1;engine.runRenderLoop(()=>{box.rotation.y+=0.02;scene.render()});<\/script></body></html>`;}
else{h=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-gradient-to-br from-slate-50 to-sky-50 p-6"><div class="max-w-3xl mx-auto"><div class="bg-white rounded-[24px] shadow-xl p-8"><h1 class="text-4xl font-extrabold">${escapeHtml(prompt.slice(0,60))}</h1><p class="text-slate-500 mt-3">Built by Sofia - SBSU 2026</p><div class="mt-6 text-xs text-slate-400"><b>Next:</b> Supabase, Image Gen, QR Connect</div></div></div></body></html>`;}
return h;}
function buildProject(prompt){if(!prompt)return;showChat();addMsg('user',prompt);const think=document.createElement('div');think.className='flex gap-2';think.innerHTML=`<div class="w-8 h-8 rounded-xl grad-btn flex items-center justify-center text-white font-bold text-xs">S</div><div class="glass rounded-2xl px-4 py-3 text-sm">Sofia building...</div>`;$('#msgs').appendChild(think);setTimeout(()=>{think.remove();const html=generateApp(prompt);currentHtml=html;$('#previewFrame').srcdoc=html;$('#previewFrame').classList.remove('hidden');$('#previewEmpty').classList.add('hidden');$('#codeView').textContent=html;addMsg('sofia',`<b>Built! ✨</b> ${escapeHtml(prompt)}<br><br><b>Why:</b> Glassmorphism 2026, offline PWA, localStorage saves ✅<br><br><b>Next:</b> Supabase, Image Gen, Broadcast QR<br><br>Preview → Code → ZIP`);const item={id:Date.now(),title:prompt.slice(0,50),prompt,html,time:new Date().toLocaleString()};projects.unshift(item);localStorage.setItem('sbsu_projects',JSON.stringify(projects));renderProjects();toggleRight(true);},700);}
$('#buildGo').onclick=()=>{const v=$('#buildInput').value.trim();if(v)buildProject(v);};
$('#buildInput').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v)buildProject(v);}};
$('#btnSend').onclick=()=>{const v=$('#chatInput').value.trim();if(!v)return;$('#chatInput').value='';buildProject(v);};
document.querySelectorAll('.sugg').forEach(b=>b.onclick=()=>{$('#buildInput').value=b.textContent;buildProject(b.textContent);});
$('#btnNewChat').onclick=()=>{$('#hero').classList.remove('hidden');$('#chatPanel').classList.add('hidden');$('#msgs').innerHTML='';$('#previewFrame').classList.add('hidden');$('#previewEmpty').classList.remove('hidden');toggleSidebar(false);};
function buildApiKeysUI(){const grid=$('#apiKeysGrid');grid.innerHTML='';API_KEYS.forEach(k=>{const d=document.createElement('div');d.innerHTML=`<label class="font-bold">${k}</label><input data-key="${k}" class="w-full mt-1 glass rounded-xl px-3 py-2 outline-none" placeholder="${k}" value="${localStorage.getItem(k)||''}"/>`;grid.appendChild(d);});}
buildApiKeysUI();
$('#btnSettings').onclick=()=>{$('#modalSettings').classList.remove('hidden');$('#modalSettings').classList.add('flex');toggleSidebar(false);};
$('#closeSettings').onclick=()=>$('#modalSettings').classList.add('hidden');
$('#saveSettings').onclick=()=>{document.querySelectorAll('[data-key]').forEach(i=>localStorage.setItem(i.dataset.key,i.value.trim()));alert('Saved 32 keys!');$('#modalSettings').classList.add('hidden');};
$('#btnConnect').onclick=()=>{$('#modalConnect').classList.remove('hidden');$('#modalConnect').classList.add('flex');if(!peer){peer=new Peer();peer.on('open',id=>{$('#peerId').textContent='My Peer ID: '+id;const box=$('#qrBox');box.innerHTML='';new QRCode(box,{text:location.href.split('?')[0]+'?connect='+id,width:180,height:180});});peer.on('connection',conn=>{connections.push(conn);conn.on('data',d=>{if(d.cmd){addMsg('sofia',`Host: ${escapeHtml(d.cmd)}`);if(d.cmd.toLowerCase().includes('youtube'))window.open('https://youtube.com','_blank');}$('#connectedPeers').innerHTML+=`<div>Connected: ${conn.peer}</div>`;});});}const params=new URLSearchParams(location.search);const host=params.get('connect');if(host&&peer){const c=peer.connect(host);c.on('open',()=>{$('#connectedPeers').innerHTML+=`<div>Connected to host ${host}</div>`;connections.push(c);});}};
$('#closeConnect').onclick=()=>$('#modalConnect').classList.add('hidden');
$('#btnBroadcast').onclick=()=>{const cmd=$('#broadcastCmd').value.trim();if(!cmd)return;connections.forEach(c=>c.send({cmd}));addMsg('sofia',`📢 Broadcast to ${connections.length} devices: ${escapeHtml(cmd)}`);if(cmd.toLowerCase().includes('youtube'))window.open('https://youtube.com','_blank');};
$('#btnZip').onclick=()=>{if(!currentHtml){alert('Build first');return;}const zip=new JSZip();zip.file('index.html',currentHtml);zip.file('README.md','# SBSU AI Studio');zip.file('.env.example','SUPABASE_URL=\nSUPABASE_ANON_KEY=\nGROQ_API_KEY=');zip.generateAsync({type:'blob'}).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sbsu-ai-studio.zip';a.click();});};
$('#btnCopyCode').onclick=()=>{navigator.clipboard.writeText(currentHtml||$('#codeView').textContent);alert('Copied');};
$('#btnDlHtml').onclick=()=>{if(!currentHtml)return;const blob=new Blob([currentHtml],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();};
function setupMic(btnId,inputId){const btn=document.getElementById(btnId),inp=document.getElementById(inputId);if(!btn)return;btn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Use Chrome');return;}const rec=new SR();rec.lang=$('#voiceLang').value||'en-IN';rec.start();btn.textContent='🔴';rec.onresult=e=>{inp.value=e.results[0][0].transcript;btn.textContent='🎤';if(inputId==='buildInput')buildProject(inp.value.trim());};rec.onend=()=>btn.textContent='🎤';};}
setupMic('micBuild','buildInput');setupMic('micChat','chatInput');
if(innerWidth>=1024)toggleSidebar(true);
</script>
</body>
</html>

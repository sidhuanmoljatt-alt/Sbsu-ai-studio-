<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SBSU X SOFIA V3.1 ULTIMATE</title><script src=https://cdn.tailwindcss.com></script><style>body{background:#0a0e1a;color:#e2e8f0}iframe{width:100%;height:70vh;background:#000;border-radius:16px;border:0}</style></head><body class=p-2><div class="max-w-5xl mx-auto"><header class="flex justify-between p-3 bg-[#111a2e] rounded-xl"><b class=text-emerald-400>SBSU FEROZEPUR X SOFIA V3.1 ULTIMATE</b><span class="bg-emerald-900 px-3 rounded-full text-xs">Offline Always Works</span></header><div class="grid grid-cols-4 gap-2 my-3"><button onclick=showTab(0) id=t0 class="bg-[#1a2540] p-3 rounded-2xl text-xs">📒 Ledger</button><button onclick=showTab(1) id=t1 class="bg-emerald-700 p-3 rounded-2xl text-xs">⚡ Sofia AI</button><button onclick=showTab(2) id=t2 class="bg-[#1a2540] p-3 rounded-2xl text-xs">🔗 QR</button><button onclick=showTab(3) id=t3 class="bg-[#1a2540] p-3 rounded-2xl text-xs">🤖 Agents</button></div><div id=tab0 class="bg-[#111a2e] p-4 rounded-2xl hidden"><h2 class=font-bold>📒 Ledger</h2><div id=ledger class="text-sm mt-2 text-gray-400">Your builds appear here</div></div><div id=tab1 class="bg-[#111a2e] p-4 rounded-2xl"><p class="text-xs mb-2 text-emerald-300">⚡ V3.1 ULTIMATE - OFFLINE - NO API - ALWAYS WORKS</p><input id=promptInput value="Build PUBG style with Babylon.js" class="w-full p-3 rounded-xl bg-black border border-[#2a3a5e] text-sm mb-2"><button onclick=doBuild() class="w-full bg-emerald-500 py-4 rounded-xl font-black text-lg">🚀 BUILD NOW (Offline Instant)</button><div class="grid grid-cols-2 gap-2 my-3"><button onclick=quickBuild('pubg') class="bg-[#1a2540] p-3 rounded-xl text-xs">🔫 PUBG Babylon FPS</button><button onclick=quickBuild('minecraft') class="bg-[#1a2540] p-3 rounded-xl text-xs">🎮 Minecraft Three.js</button>
<button onclick=quickBuild('calc') class="bg-[#1a2540] p-3 rounded-xl text-xs">🧮 Calculator Pro</button><button onclick=quickBuild('portfolio') class="bg-[#1a2540] p-3 rounded-xl text-xs">🌐 Portfolio SBSU</button></div><div id=log class="bg-black p-3 rounded-xl text-xs font-mono mt-2">Ready V3.1 ULTIMATE. Click BUILD. No AI server needed!</div><iframe id=preview></iframe></div><div id=tab2 class="bg-[#111a2e] p-4 rounded-2xl hidden"><h2 class=font-bold>🔗 Share</h2><div class="bg-white p-4 rounded-xl w-fit mx-auto mt-3"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://sidhuanmoljatt-alt.github.io/Sbsu-ai-studio-/" alt=qr></div></div><div id=tab3 class="bg-[#111a2e] p-4 rounded-2xl hidden"><h2 class=font-bold>🤖 Agents</h2><div class="flex gap-2 mt-2"><input id=agentName placeholder="Agent name" class="flex-1 p-3 rounded-xl bg-black border text-sm"><button onclick=createAgent() class="bg-emerald-500 px-4 rounded-xl">Create</button></div><div id=agentList class="mt-3 text-sm"></div></div></div><script>function showTab(n){for(let i=0;i<4;i++){document.getElementById('tab'+i).classList.add('hidden')}document.getElementById('tab'+n).classList.remove('hidden')}function quickBuild(t){document.getElementById('promptInput').value=t;doBuild(t)}const BUILDS={pubg:`<html><head><script src=https://cdn.babylonjs.com/babylon.js><\/script><style>body{margin:0;overflow:hidden;background:#000}canvas{width:100%;height:100vh}#ui{position:absolute;top:10px;left:10px;color:white;font-family:Arial;background:rgba(0,0,0,0.6);padding:10px;border-radius:10px}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:24px}<\/style></head><body><canvas id=c><\/canvas><div id=ui>🔫 PUBG SBSU - WASD Move | Mouse Look | Click to lock<br>Green ground = Erangel | Boxes = Buildings</div><div id=cross>+<\/div><script>const canvas=document.getElementById('c');const engine=new BABYLON.Engine(canvas,true);const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color3(0.5,0.8,0.9);const camera=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,5,-10),scene);camera.attachControl(canvas,true);camera.speed=0.5;const light=new BABYLON.HemisphericLight('l',new BABYLON.Vector3(0,1,0),scene);const ground=BABYLON.MeshBuilder.CreateGround('g',{width:200,height:200},scene);const gmat=new BABYLON.StandardMaterial('gm',scene);gmat.diffuseColor=new BABYLON.Color3(0.2,0.6,0.2);ground.material=gmat;for(let i=0;i<20;i++){const b=BABYLON.MeshBuilder.CreateBox('b'+i,{size:2+Math.random()*3},scene);b.position=new BABYLON.Vector3((Math.random()-0.5)*100,1,(Math.random()-0.5)*100);const m=new BABYLON.StandardMaterial('m'+i,scene);m.diffuseColor=new BABYLON.Color3(Math.random(),Math.random(),Math.random());b.material=m}engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());<\/script><\/body><\/html>`,minecraft:`<html><head><script src=https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js><\/script><style>body{margin:0;overflow:hidden;background:#87CEEB}<\/style></head><body><div style="position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.7);padding:10px;border-radius:10px">🎮 MINECRAFT SBSU - WASD + Mouse<\/div><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++){const c=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:(x+z)%2==0?0x5C9C3E:0x8B7355}));c.position.set(x,0,z);scene.add(c)}camera.position.set(0,5,10);let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());function animate(){requestAnimationFrame(animate);if(keys['w'])camera.position.z-=0.1;if(keys['s'])camera.position.z+=0.1;if(keys['a'])camera.position.x-=0.1;if(keys['d'])camera.position.x+=0.1;renderer.render(scene,camera)}animate();<\/script><\/body><\/html>`,calc:`<html><head><style>body{background:#0f0f0f;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial}.calc{background:#1a1a1a;padding:20px;border-radius:20px;width:300px}#display{background:#000;color:#0f0;height:60px;font-size:32px;text-align:right;padding:10px;border-radius:10px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:60px;border-radius:15px;border:none;font-size:20px;font-weight:bold}.num{background:#333;color:white}.op{background:#ff9500;color:white}.eq{background:#00c853;color:white;grid-column:span 2}.clear{background:#ff3b30}<\/style></head><body><div class=calc><div id=display>0<\/div><div class=grid><button class=clear onclick=clearAll()>C<\/button><button class=op onclick=append('/')>/<\/button><button class=op onclick=append('*')>*<\/button><button class=op onclick=append('-')>-<\/button><button class=num onclick=append('7')>7<\/button><button class=num onclick=append('8')>8<\/button><button class=num onclick=append('9')>9<\/button><button class=op onclick=append('+')>+<\/button><button class=num onclick=append('4')>4<\/button><button class=num onclick=append('5')>5<\/button><button class=num onclick=append('6')>6<\/button><button class=num onclick=append('.')>.<\/button><button class=num onclick=append('1')>1<\/button><button class=num onclick=append('2')>2<\/button><button class=num onclick=append('3')>3<\/button><button class=num onclick=append('0')>0<\/button><button class=eq onclick=calc()>=<\/button><\/div><\/div><script>let d=document.getElementById('display');function append(v){if(d.innerText=='0'&&v!='.')d.innerText=v;else d.innerText+=v}function clearAll(){d.innerText='0'}function calc(){try{d.innerText=eval(d.innerText)}catch{d.innerText='Error'}}<\/script><\/body><\/html>`,portfolio:`<html><head><script src=https://cdn.tailwindcss.com><\/script></head><body class="bg-[#0a0e1a] text-white p-6"><div class="max-w-3xl mx-auto"><div class="bg-gradient-to-r from-emerald-600 to-blue-600 p-8 rounded-3xl"><h1 class="text-4xl font-black">Amoljatt Sidhu<\/h1><p class="text-xl mt-2">SBSU Ferozepur | AI Studio Founder<\/p><\/div><div class="grid grid-cols-3 gap-4 mt-6"><div class="bg-[#111a2e] p-4 rounded-xl"><b>🎮 Games<\/b><br>Minecraft, PUBG<\/div><div class="bg-[#111a2e] p-4 rounded-xl"><b>🧮 Apps<\/b><br>Calculator<\/div><div class="bg-[#111a2e] p-4 rounded-xl"><b>🌐 Web<\/b><br>Portfolio<\/div><\/div><\/div><\/body><\/html>`};function doBuild(type){let input=document.getElementById('promptInput').value.toLowerCase();let t=type||'pubg';if(!type){if(input.includes('minecraft'))t='minecraft';else if(input.includes('calc'))t='calc';else if(input.includes('portfolio'))t='portfolio';else t='pubg'}document.getElementById('log').innerText='Building '+t.toUpperCase()+'... OFFLINE...';document.getElementById('preview').srcdoc=BUILDS[t];document.getElementById('log').innerText='✅ '+t.toUpperCase()+' BUILD COMPLETE! WASD to move!';document.getElementById('ledger').innerHTML='<div class=p-2 bg-black rounded-lg mb-1>✅ '+t+' - '+new Date().toLocaleTimeString()+'</div>'+document.getElementById('ledger').innerHTML}function createAgent(){const n=document.getElementById('agentName').value;if(!n)return;document.getElementById('agentList').innerHTML+='<div class=p-2 bg-black rounded-lg mb-1>🤖 '+n+' - Active<\/div>'}showTab(1);</script></body></html>
